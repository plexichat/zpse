# Nightly fuzzing: 4 hours, stateful, parallel across build variants.
#
# Runs tests/suites/test_fuzz.c for up to 4 hours per variant on a
# nightly schedule. Each variant runs in its own matrix job (parallel,
# ~4h wall time instead of ~12h sequential). The fuzzer's final PRNG seed
# is saved per-variant; the next nightly downloads it and continues from
# where that variant left off instead of repeating the same cases.
#
# Informational: does not fail the build. Results land in each job's
# summary and as per-variant seed artifacts for the aggregate job.
name: fuzz-nightly

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, scalar, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Download previous seed (continue, don't restart)
        id: restore
        run: |
          SEED_FILE=/tmp/fuzz_seed_${{ matrix.variant }}.txt
          if [ -f "$SEED_FILE" ]; then
            echo "seed=$(cat "$SEED_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "seed=0x2468ACE0" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true
      - name: Download previous seed artifact
        uses: actions/download-artifact@v4
        with:
          name: fuzz-nightly-seed-${{ matrix.variant }}
          path: /tmp
        continue-on-error: true
      - name: Build the fuzzer (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            default)
              cc -std=c11 -O2 -Wall -Wextra -DNDEBUG -Iinclude \
                tests/suites/test_fuzz.c src/zpse_unity.c -o /tmp/fuzz_nightly_${{ matrix.variant }}
              ;;
            scalar)
              cc -std=c11 -O2 -Wall -Wextra -DNDEBUG -DZPSE_FORCE_SCALAR \
                -Iinclude tests/suites/test_fuzz.c src/zpse_unity.c \
                -o /tmp/fuzz_nightly_${{ matrix.variant }}
              ;;
            asan)
              cc -std=c11 -O1 -Wall -Wextra -fsanitize=address,undefined \
                -fno-omit-frame-pointer -DNDEBUG -Iinclude \
                tests/suites/test_fuzz.c src/zpse_unity.c \
                -o /tmp/fuzz_nightly_${{ matrix.variant }}
              ;;
          esac
      - name: Run 4 hours of fuzzing (${{ matrix.variant }})
        run: |
          set -o pipefail
          SEED="${{ steps.restore.outputs.seed }}"
          ZPSE_FUZZ_CONTINUE=1 timeout 4h /tmp/fuzz_nightly_${{ matrix.variant }} "$SEED" \
            | tee /tmp/fuzz_nightly_${{ matrix.variant }}.txt
          echo "${{ matrix.variant }} fuzz_exit=${PIPESTATUS[0]}"
          # Save the final seed so the next nightly continues from here
          SEED_END=$(grep -oP 'seed=\K[0-9A-Fa-f]+' /tmp/fuzz_nightly_${{ matrix.variant }}.txt | tail -1)
          echo -n "$SEED_END" > /tmp/fuzz_seed_${{ matrix.variant }}.txt
          cat /tmp/fuzz_seed_${{ matrix.variant }}.txt
      - name: Save seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-seed-${{ matrix.variant }}
          path: /tmp/fuzz_seed_${{ matrix.variant }}.txt
          retention-days: 30
      - name: Report (${{ matrix.variant }})
        if: always()
        run: |
          {
            echo '### nightly fuzz: ${{ matrix.variant }} (4 hours, stateful)'
            echo
            echo 'test_fuzz.c differential fuzzer runs for 4 hours every night.'
            echo 'The PRNG seed is saved after each run and passed as the'
            echo 'starting seed on the next night, so coverage accumulates'
            echo 'instead of repeating the same cases.'
            echo
            echo '```'; cat /tmp/fuzz_nightly_${{ matrix.variant }}.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
