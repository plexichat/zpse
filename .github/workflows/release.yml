name: Automated Release Creator

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip

      - name: Build binaries
        # -O2, like everything the README measures. These two artifacts used to
        # be built at -O3 on the strength of a few percent of encode; re-run on
        # the current tree the amalgamation is about 1% SLOWER at -O3 with 41%
        # more text and byte-identical output (README, "What the compiler
        # adds"), so the release now matches the level every figure here is
        # measured at.
        run: |
          gcc-15 -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG -Iinclude \
            tests/tools/zpse_cli.c src/zpse_unity.c -o zpse_cli_linux
          gcc-15 -std=c11 -O2 -DNDEBUG -Iinclude tests/tools/zpse_cli.c src/zpse_unity.c \
            -o zpse_cli_linux_fast

      - name: Generate GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            zpse_cli_linux
            zpse_cli_linux_fast
