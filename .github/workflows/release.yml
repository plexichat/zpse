name: Automated Release Creator

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip

      - name: Build binaries
        # -O3 for the two artifacts a user actually runs: the amalgamation is
        # a single translation unit, so -O3 reaches the inliner across every
        # module, and it is worth a few percent of encode (README, "What the
        # compiler adds") with byte-identical output and sizes. The tree still
        # builds and measures at -O2 everywhere else, so every number in the
        # README stays an -O2 number.
        run: |
          gcc-15 -std=c11 -O3 -Wall -Wextra -Werror -DNDEBUG -Iinclude \
            tests/tools/zpse_cli.c src/zpse_unity.c -o zpse_cli_linux
          gcc-15 -std=c11 -O3 -DNDEBUG -Iinclude tests/tools/zpse_cli.c src/zpse_unity.c \
            -o zpse_cli_linux_fast

      - name: Generate GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            zpse_cli_linux
            zpse_cli_linux_fast
