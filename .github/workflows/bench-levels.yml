# zpse across all 9 effort levels (1=FASTEST ... 9=MAX) on the full
# 25-case corpus from bench_columnar.c. Same corpus, same 4 MiB size,
# same 64 KiB blocks, same pinned single core.
#
# Informational: a slower number than the last run must not fail the
# build. The table lands in the job summary so it is readable on the run
# page; no per-job artifact is uploaded -- the aggregate job collects
# everything into one summary.
name: bench-levels

on:
  push:
  workflow_dispatch:

jobs:
  levels:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Compiler
        run: |
          cc --version | head -1
      - name: Build the harness
        run: |
          gcc-15 -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG -Iinclude \
            tests/benchmarks/bench_levels.c src/zpse_unity.c \
            -o /tmp/bench_levels
      - name: Run the matrix (25 cases x 9 levels, single core)
        run: |
          taskset -c 0 /tmp/bench_levels 12 3 | tee /tmp/bench_levels.txt
          {
            echo '### zpse effort levels on 25-column corpus, single core'
            echo
            echo '4 MiB per case as 64 x 64 KiB blocks, one level per row:'
            echo '1=FASTEST 2 3=FASTER 4 5=BALANCED 6 7=TIGHTER 8 9=MAX.'
            echo 'Ratio is input:output; encode/decode are MB/s of uncompressed'
            echo 'bytes; best(med/max)-of-N. Every decode verified before timing.'
            echo 'A sizes-monotonic check runs per case: because level 1 screens'
            echo 'only the three uniform predictors, it can write a smaller block'
            echo 'than a mid level on structured data, so sizes are not guaranteed'
            echo 'to descend from 1 to 9; that is a feature of the fast tier, not'
            echo 'a regression.'
            echo
            cat /tmp/bench_levels.txt
          } >> "$GITHUB_STEP_SUMMARY"
