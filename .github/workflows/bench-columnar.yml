# Columnar in-process benchmark: zpse against zstd / lz4 / zlib / brotli on
# ten column-shaped corpora (int/float/dictionary/timestamp/bool columns),
# every codec fed identical bytes, framed identically (64 KiB blocks), one
# pinned core, everything in RAM, every decode verified before it is timed.
#
# Informational, like workflows/bench.yml: a slower number than the last run
# must not fail the build, and a missing competitor runtime is skipped with
# a line in the header rather than silently reported as zero. The result
# table lands in the job summary, so every push says what the columnar
# numbers did; the raw run is kept as an artifact for diffing.
name: bench-columnar

on:
  push:
  workflow_dispatch:

jobs:
  columnar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler and competitor runtimes
        run: |
          cc --version | head -1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd lz4 brotli zlib1g
      - name: Host info (CPU, RAM, OS, compiler)
        run: |
          {
            echo '### host'
            echo
            echo '```'
            echo "os: $(uname -srmo)"
            echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo "cpus: $(nproc) ($(grep -c '^processor' /proc/cpuinfo) in /proc/cpuinfo)"
            echo "ram: $(free -h | awk '/^Mem:/ {print $2 \" total, \" $7 \" available\"}')"
            echo "mhz: $(awk -F: '/cpu MHz/ {print $2; exit}' /proc/cpuinfo | xargs) MHz"
            echo "flags: $(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | xargs | cut -c1-200)..."
            cc --version | head -1
            echo '```'
          } | tee /tmp/host_info.txt
          cat /tmp/host_info.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build the harness
        run: |
          cc -std=c11 -O2 -Wall -Wextra -DNDEBUG -Iinclude \
            tests/benchmarks/bench_columnar.c src/zpse_unity.c -ldl -o /tmp/benchcol
      - name: Run the matrix (10 cases x 5 codecs, single core)
        run: |
          taskset -c 0 /tmp/benchcol 12 3 all all | tee /tmp/benchcol.txt
          {
            echo '### columnar in-process, single core'
            echo
            echo '4 MiB per case as 64 x 64 KiB blocks; identical bytes per'
            echo 'codec; every decode verified; best-of-N; ratios are'
            echo 'input:output. Levels: zpse default, zstd -3, lz4 fast,'
            echo 'zlib -6, brotli q5 (see the versions line).'
            echo
            cat /tmp/benchcol.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-columnar
          path: |
            /tmp/benchcol.txt
            /tmp/host_info.txt
          if-no-files-found: error
          retention-days: 90
