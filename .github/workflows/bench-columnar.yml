# Columnar in-process benchmark: zpse against zstd / lz4 / zlib / brotli on
# eighteen corpora (int/float/dictionary/timestamp/bool columns plus
# text/JSON/log/sorted/zeros/gapped-ts/DNA/UTF-8 byte streams), every
# codec fed identical bytes, framed identically (64 KiB blocks), one
# pinned core, everything in RAM, every decode verified before it is timed.
#
# Informational, like workflows/bench.yml: a slower number than the last run
# must not fail the build, and a missing competitor runtime is skipped with
# a line in the header rather than silently reported as zero. The result
# table lands in the job summary, so every push says what the columnar
# numbers did; the raw run is kept as an artifact for diffing.
name: bench-columnar

on:
  push:
  workflow_dispatch:

jobs:
  columnar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler and competitor runtimes
        run: |
          cc --version | head -1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd lz4 brotli zlib1g
      - name: Build the harness
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG -Iinclude \
            tests/benchmarks/bench_columnar.c src/zpse_unity.c -ldl -o /tmp/benchcol
          # The stats mode is compiled only with -DZPSE_TRIAL_STATS; building
          # it here keeps that opt-in instrument from rotting away.
          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG -DZPSE_TRIAL_STATS \
            -Iinclude tests/benchmarks/bench_columnar.c src/zpse_unity.c \
            -ldl -o /tmp/benchcol-stats
      - name: Predictor trial stats (what the encoder really runs)
        run: |
          taskset -c 0 /tmp/benchcol-stats stats all | tee /tmp/benchcol-stats.txt
          {
            echo '### which predictors the encoder actually trials'
            echo
            echo 'Classify calls per predictor over the same eighteen corpora,'
            echo 'counted in a -DZPSE_TRIAL_STATS build; the denominator is'
            echo 'tiles whose search ran. Informational, like the table below.'
            echo
            cat /tmp/benchcol-stats.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the matrix (18 cases x 5 codecs, single core)
        run: |
          taskset -c 0 /tmp/benchcol 12 3 all all | tee /tmp/benchcol.txt
          taskset -c 0 /tmp/benchcol 6 2 all all 16 | tee /tmp/benchcol-16k.txt
          {
            echo '### columnar in-process, single core'
            echo
            echo '4 MiB per case as 64 x 64 KiB blocks (plus a 256 x 16 KiB'
            echo 'sweep in the second artifact); identical bytes per codec;'
            echo 'every decode verified; best(med/max)-of-N with a ratio x'
            echo 'encode-speed eff column and a per-codec summary; ratios are'
            echo 'input:output. Levels: zpse default, zstd -3, lz4 fast,'
            echo 'zlib -6, brotli q5 (see the versions line).'
            echo 'Host lines ride in the same file, above the table.'
            echo
            cat /tmp/benchcol.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-columnar
          path: |
            /tmp/benchcol.txt
            /tmp/benchcol-16k.txt
            /tmp/benchcol-stats.txt
          if-no-files-found: error
          retention-days: 90
