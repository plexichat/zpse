# Differential fuzzing: 10 minutes per commit, every push.
#
# Builds tests/suites/test_fuzz.c (randomized differential corpus over
# thousands of shapes and sizes) in five build variants, plus two libFuzzer
# targets -- fuzz_target (compress+decompress round-trip across all 9 effort
# levels) and fuzz_decode (arbitrary bytes fed directly to the decoder,
# attacking error-handling and corrupt-stream paths the encoder-only fuzzer
# never reaches). Each matrix job runs for up to 10 minutes in parallel, so
# wall time is ~10 minutes, not the sum of all variants.
#
# Informational: a timeout or a non-zero exit does not fail the build.
name: fuzz

on:
  push:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # target: which fuzz target to build and run
        # variant: build mode for that target
        include:
          # --- test_fuzz.c variants (gcc, continuous mode) ---
          - target: test_fuzz
            variant: default
            cc: cc
            cflags: "-std=c11 -O2 -Wall -Wextra -DNDEBUG -Iinclude"
            run_env: "ZPSE_FUZZ_CONTINUE=1"
            run_args: ""
          - target: test_fuzz
            variant: scalar
            cc: cc
            cflags: "-std=c11 -O2 -Wall -Wextra -DNDEBUG -DZPSE_FORCE_SCALAR -Iinclude"
            run_env: "ZPSE_FUZZ_CONTINUE=1"
            run_args: ""
          - target: test_fuzz
            variant: swap
            cc: cc
            cflags: "-std=c11 -O2 -Wall -Wextra -DNDEBUG -DZPSE_FORCE_TRIAL_SWAP -Iinclude"
            run_env: "ZPSE_FUZZ_CONTINUE=1"
            run_args: ""
          - target: test_fuzz
            variant: asan
            cc: cc
            cflags: "-std=c11 -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -DNDEBUG -Iinclude"
            run_env: "ZPSE_FUZZ_CONTINUE=1"
            run_args: ""
          - target: test_fuzz
            variant: asan_scalar
            cc: cc
            cflags: "-std=c11 -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -DNDEBUG -DZPSE_FORCE_SCALAR -Iinclude"
            run_env: "ZPSE_FUZZ_CONTINUE=1"
            run_args: ""
          # --- fuzz_target.c variants (clang libFuzzer) ---
          - target: fuzz_target
            variant: default
            cc: clang
            cflags: "-std=c11 -O2 -fsanitize=fuzzer -fno-omit-frame-pointer -Iinclude"
            run_env: ""
            run_args: ""
          - target: fuzz_target
            variant: asan
            cc: clang
            cflags: "-std=c11 -O2 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer -Iinclude"
            run_env: ""
            run_args: ""
          # --- fuzz_decode.c variants (clang libFuzzer) ---
          - target: fuzz_decode
            variant: default
            cc: clang
            cflags: "-std=c11 -O2 -fsanitize=fuzzer -fno-omit-frame-pointer -Iinclude"
            run_env: ""
            run_args: ""
          - target: fuzz_decode
            variant: asan
            cc: clang
            cflags: "-std=c11 -O2 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer -Iinclude"
            run_env: ""
            run_args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Build the fuzzer (${{ matrix.target }} / ${{ matrix.variant }})
        run: |
          case "${{ matrix.target }}" in
            test_fuzz)
              ${{ matrix.cc }} ${{ matrix.cflags }} \
                tests/suites/test_fuzz.c src/zpse_unity.c \
                -o /tmp/fuzz_${{ matrix.target }}_${{ matrix.variant }}
              ;;
            fuzz_target|fuzz_decode)
              ${{ matrix.cc }} ${{ matrix.cflags }} \
                tests/suites/${{ matrix.target }}.c src/zpse_unity.c \
                -o /tmp/fuzz_${{ matrix.target }}_${{ matrix.variant }}
              ;;
          esac
      - name: Run 10 minutes of fuzzing (${{ matrix.target }} / ${{ matrix.variant }})
        continue-on-error: true
        run: |
          ${{ matrix.run_env }} timeout 10m /tmp/fuzz_${{ matrix.target }}_${{ matrix.variant }} ${{ matrix.run_args }} \
            | tee /tmp/fuzz_${{ matrix.target }}_${{ matrix.variant }}.txt || true
          echo "${{ matrix.target }}_${{ matrix.variant }} fuzz completed"
      - name: Report (${{ matrix.target }} / ${{ matrix.variant }})
        if: always()
        run: |
          {
            echo '### fuzz: ${{ matrix.target }} / ${{ matrix.variant }}'
            echo
            if [ "${{ matrix.target }}" = "test_fuzz" ]; then
              echo 'test_fuzz.c runs in continuous mode (ZPSE_FUZZ_CONTINUE=1),'
              echo 'generating random blocks until timeout 10m kills it. A'
              echo 'deterministic FNV-1a digest every 2048 cases proves no'
              echo 'bit-layout regression; zero FAIL lines proves every input'
              echo 'round-trips.'
            elif [ "${{ matrix.target }}" = "fuzz_target" ]; then
              echo 'fuzz_target.c is a libFuzzer target that compresses and'
              echo 'decompresses each fuzz input across all 9 effort levels,'
              echo 'checking round-trip integrity. ASan/UBSan catch memory'
              echo 'safety bugs; zero crashes proves the encoder/decoder'
              echo 'pair is robust on arbitrary inputs.'
            else
              echo 'fuzz_decode.c is a libFuzzer target that feeds arbitrary'
              echo 'bytes directly to zpse_decompress_block and'
              echo 'zpse_decompress_frame, attacking decoder error-handling,'
              echo 'boundary, and corrupt-stream paths that valid encoder'
              echo 'output never reaches. Zero crashes proves the decoder'
              echo 'rejects malformed input safely.'
            fi
            echo
            echo '```'; cat /tmp/fuzz_${{ matrix.target }}_${{ matrix.variant }}.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
