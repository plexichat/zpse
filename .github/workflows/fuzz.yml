# Differential fuzzing: 10 minutes per commit, every push.
#
# Builds tests/suites/test_fuzz.c (randomized differential corpus over
# thousands of shapes and sizes) in five variants -- default, scalar,
# trial-swap, ASan+UBSan default, ASan+UBSan scalar -- and runs each for
# up to 10 minutes. Jobs run in parallel so wall time is ~10 minutes,
# not 50. The fuzzer prints a deterministic FNV-1a digest -- identical
# on every run and platform -- so a run that reports the same digest as
# the previous one proves no regression; a different digest with zero
# failures means the encoder still round-trips every input but the bit
# layout changed (expected only when the format intentionally changed).
#
# Informational: a timeout or a non-zero exit does not fail the build.
name: fuzz

on:
  push:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [default, scalar, swap, asan, asan_scalar]
    steps:
      - uses: actions/checkout@v4
      - name: Build the fuzzer (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            default)
              cc -std=c11 -O2 -Wall -Wextra -DNDEBUG -Iinclude \
                tests/suites/test_fuzz.c src/zpse_unity.c -o /tmp/fuzz_${{ matrix.variant }}
              ;;
            scalar)
              cc -std=c11 -O2 -Wall -Wextra -DNDEBUG -DZPSE_FORCE_SCALAR \
                -Iinclude tests/suites/test_fuzz.c src/zpse_unity.c \
                -o /tmp/fuzz_${{ matrix.variant }}
              ;;
            swap)
              cc -std=c11 -O2 -Wall -Wextra -DNDEBUG -DZPSE_FORCE_TRIAL_SWAP \
                -Iinclude tests/suites/test_fuzz.c src/zpse_unity.c \
                -o /tmp/fuzz_${{ matrix.variant }}
              ;;
            asan)
              cc -std=c11 -O1 -Wall -Wextra -fsanitize=address,undefined \
                -fno-omit-frame-pointer -DNDEBUG -Iinclude \
                tests/suites/test_fuzz.c src/zpse_unity.c \
                -o /tmp/fuzz_${{ matrix.variant }}
              ;;
            asan_scalar)
              cc -std=c11 -O1 -Wall -Wextra -fsanitize=address,undefined \
                -fno-omit-frame-pointer -DNDEBUG -DZPSE_FORCE_SCALAR \
                -Iinclude tests/suites/test_fuzz.c src/zpse_unity.c \
                -o /tmp/fuzz_${{ matrix.variant }}
              ;;
          esac
      - name: Run 10 minutes of fuzzing (${{ matrix.variant }})
        run: |
          set -o pipefail
          ZPSE_FUZZ_CONTINUE=1 timeout 10m /tmp/fuzz_${{ matrix.variant }} \
            | tee /tmp/fuzz_${{ matrix.variant }}.txt
          echo "${{ matrix.variant }} fuzz_exit=${PIPESTATUS[0]}"
      - name: Report (${{ matrix.variant }})
        if: always()
        run: |
          {
            echo '### fuzz: ${{ matrix.variant }}'
            echo
            echo 'test_fuzz.c runs in continuous mode (ZPSE_FUZZ_CONTINUE=1),'
            echo 'generating random blocks until timeout 10m kills it. A'
            echo 'deterministic FNV-1a digest every 2048 cases proves no'
            echo 'bit-layout regression; zero FAIL lines proves every input'
            echo 'round-trips.'
            echo
            echo '```'; cat /tmp/fuzz_${{ matrix.variant }}.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
