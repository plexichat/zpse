# Aggregate: one combined commit-level report from all benchmark jobs.
#
# Triggers when any benchmark workflow finishes (bench-columnar,
# bench-levels, fuzz). Uses the GitHub API to fetch the latest outputs
# from the sibling workflows for the same commit and writes a single
# aggregated summary so the commit page has one place to read everything.
#
# Informational: never fails the build.
name: bench-aggregate

on:
  workflow_run:
    workflows: [bench-columnar, bench-levels, fuzz]
    types:
      - completed

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
      - name: Collect sibling workflow outputs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo '### benchmark aggregate: ${{ github.event.workflow_run.name }}'
            echo
            echo "Commit: \`$SHA\`"
            echo
            for wf in bench-columnar bench-levels fuzz; do
              echo "#### $wf"
              echo
              RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf.yml/runs" \
                --jq ".workflow_runs[] | select(.head_sha == \"$SHA\" and .status == \"completed\") | .id" | head -1)
              if [ -n "$RUN_ID" ]; then
                ART=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
                  --jq ".artifacts[0].archive_download_url" 2>/dev/null || true)
                if [ -n "$ART" ]; then
                  gh api "$ART" -H "Accept: application/zip" > /tmp/$wf.zip 2>/dev/null || true
                  if [ -f /tmp/$wf.zip ] && unzip -l /tmp/$wf.zip >/dev/null 2>&1; then
                    echo "Artifact available: $wf (see workflow run $RUN_ID)"
                    unzip -o /tmp/$wf.zip -d /tmp/$wf-out >/dev/null 2>&1 || true
                    for f in /tmp/$wf-out/*.txt; do
                      [ -f "$f" ] || continue
                      echo
                      echo "##### \`$(basename "$f")\`"
                      echo '```'
                      cat "$f" | head -80
                      echo '```'
                    done
                  fi
                else
                  echo "No artifact; summary only (workflow run $RUN_ID)"
                fi
              else
                echo "No completed run for $wf on this commit yet"
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
