# Aggregate: one combined commit-level report from all benchmark jobs.
#
# Triggers when any of bench-columnar, bench-levels, or fuzz completes, but
# only does real work once ALL three have finished for this SHA — so the
# aggregate never runs before the jobs it is meant to collect.
#
# Informational: never fails the build.
name: bench-aggregate

on:
  workflow_run:
    workflows: [bench-columnar, bench-levels, fuzz]
    types:
      - completed

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Wait until all sibling workflows are done for this SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ALL_DONE=1
          for wf in bench-columnar bench-levels fuzz; do
            STATUS=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf.yml/runs" \
              --jq ".workflow_runs[] | select(.head_sha == \"$SHA\") | .status" | head -1)
            if [ "$STATUS" != "completed" ]; then
              ALL_DONE=0
              break
            fi
          done
          echo "all_done=$ALL_DONE" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.all_done == 1
        name: Collect sibling outputs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo '### benchmark aggregate'
            echo
            echo "Commit: \`$SHA\`"
            echo
            for wf in bench-columnar bench-levels fuzz; do
              echo "#### $wf"
              echo
              RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf.yml/runs" \
                --jq ".workflow_runs[] | select(.head_sha == \"$SHA\" and .status == \"completed\") | .id" | head -1)
              if [ -z "$RUN_ID" ]; then
                echo "No completed run found for $wf"
                echo
                continue
              fi
              ART_URL=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
                --jq ".artifacts[0].archive_download_url" 2>/dev/null || true)
              if [ -n "$ART_URL" ]; then
                gh api "$ART_URL" -H "Accept: application/zip" > /tmp/$wf.zip 2>/dev/null || true
                if [ -f /tmp/$wf.zip ] && unzip -t /tmp/$wf.zip >/dev/null 2>&1; then
                  unzip -o /tmp/$wf.zip -d /tmp/$wf-out >/dev/null 2>&1 || true
                  for f in /tmp/$wf-out/*.txt; do
                    [ -f "$f" ] || continue
                    echo
                    echo "##### \`$(basename "$f")\`"
                    echo '```'
                    cat "$f" | head -80
                    echo '```'
                  done
                else
                  echo "No readable artifact for $wf (run $RUN_ID)"
                fi
              else
                echo "No artifact for $wf (run $RUN_ID)"
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.gate.outputs.all_done != 1
        name: Skip (siblings still running)
        run: echo "Not all benchmark workflows have completed for this SHA yet; skipping aggregate."
